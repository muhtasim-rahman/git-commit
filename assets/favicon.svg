<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F05032" />
      <stop offset="60%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#090D16" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#favGit)" stroke-width="2" stroke-opacity="0.8" />

  <!-- Git Branch Spine -->
  <path d="M 22 50 L 22 14" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 22 38 C 22 26, 42 28, 42 18 L 42 14" stroke="url(#favGit)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Nodes -->
  <circle cx="22" cy="46" r="5" fill="#F05032" stroke="#090D16" stroke-width="2" />
  <circle cx="42" cy="18" r="5" fill="#8B5CF6" stroke="#090D16" stroke-width="2" />

  <!-- Terminal Command Prompt Icon '>' -->
  <path d="M 30 40 L 38 45 L 30 50" stroke="url(#favCyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="41" y1="50" x2="47" y2="50" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
</svg>
