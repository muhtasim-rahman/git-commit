<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F05032" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol (80x80 inside 100px height) -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Squircle -->
    <rect width="80" height="80" rx="20" fill="#0F172A" stroke="url(#gitGrad)" stroke-width="2" />
    
    <!-- Git Branch Curve Paths -->
    <!-- Main Branch Line -->
    <path d="M 28 62 L 28 18" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    
    <!-- Fork Curve Line -->
    <path d="M 28 48 C 28 34, 52 38, 52 26 L 52 18" stroke="url(#gitGrad)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Active Commit Node (Bottom Left) -->
    <circle cx="28" cy="56" r="6" fill="#F05032" stroke="#0F172A" stroke-width="2" />
    
    <!-- Branch Node (Top Right) -->
    <circle cx="52" cy="24" r="6" fill="#8B5CF6" stroke="#0F172A" stroke-width="2" />
    
    <!-- Terminal Chevron '>' Symbol in glowing cyan -->
    <path d="M 36 50 L 46 56 L 36 62" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Terminal Cursor Blink '_' -->
    <line x1="49" y1="62" x2="56" y2="62" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: GitCommit Pro -->
  <g transform="translate(105, 58)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
      Git<tspan fill="url(#gitGrad)">Commit</tspan>
    </text>
    <text x="172" y="-1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#38BDF8">
      Pro
    </text>
    
    <!-- v3 Badge -->
    <rect x="228" y="-24" width="48" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.2" stroke="#A78BFA" stroke-width="1.2" />
    <text x="252" y="-8" font-family="'Fira Code', monospace, sans-serif" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">
      v3.0
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="107" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" letter-spacing="0.3">
    Universal Multi-Shell Git Commit Engine
  </text>
</svg>
